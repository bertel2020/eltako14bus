name: Package and regression checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p '*_test.py' -v
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python -m venv /tmp/eltako-wheel-check
          /tmp/eltako-wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/eltako-wheel-check/bin/python -c "import eltakobus; from eltakobus.eep import A5_10_06; assert hasattr(A5_10_06, 'encode_message2')"
